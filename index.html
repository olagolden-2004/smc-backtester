<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC Backtester</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0f14;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #111820;
      border-bottom: 1px solid #27303a;
      padding: 12px 16px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .subtitle {
      color: #8793a1;
      font-size: 12px;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    select,
    button {
      background: #18212b;
      color: #fff;
      border: 1px solid #303b47;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #202c38;
    }

    .replay {
      background: #176b3a;
      border-color: #23884d;
    }

    main {
      padding: 14px;
    }

    .chart-card {
      background: #111820;
      border: 1px solid #27303a;
      border-radius: 8px;
      overflow: hidden;
    }

    .chart-header {
      height: 52px;
      border-bottom: 1px solid #27303a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .pair-name {
      font-size: 18px;
      font-weight: bold;
    }

    .tf-name {
      color: #8793a1;
      margin-left: 8px;
    }

    .mode {
      color: #22c55e;
      font-size: 12px;
    }

    #chart {
      width: 100%;
      height: 520px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px;
      border-top: 1px solid #27303a;
      background: #0f151c;
    }

    .date-display {
      color: #9aa6b2;
      font-size: 12px;
      margin-left: auto;
    }

    .panel {
      margin-top: 14px;
      background: #111820;
      border: 1px solid #27303a;
      border-radius: 8px;
      padding: 15px;
    }

    .panel h2 {
      font-size: 17px;
      margin-bottom: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stat {
      background: #18212b;
      border-radius: 7px;
      padding: 12px;
    }

    .label {
      color: #8793a1;
      font-size: 12px;
    }

    .value {
      margin-top: 5px;
      font-weight: bold;
      font-size: 16px;
    }

    @media (max-width: 700px) {
      .top {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        width: 100%;
      }

      select {
        flex: 1;
      }

      #chart {
        height: 430px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .date-display {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="top">

    <div>
      <div class="logo">📊 SMC Backtester</div>
      <div class="subtitle">
        Smart Money Concepts Backtesting
      </div>
    </div>

    <div class="controls">

      <select id="pair">
        <option value="GBPUSD">GBPUSD</option>
        <option value="USDJPY">USDJPY</option>
        <option value="GBPJPY">GBPJPY</option>
        <option value="EURJPY">EURJPY</option>
        <option value="EURGBP">EURGBP</option>
        <option value="AUDUSD">AUDUSD</option>
        <option value="NZDUSD">NZDUSD</option>
        <option value="USDCAD">USDCAD</option>
        <option value="USDCHF">USDCHF</option>
      </select>

      <select id="timeframe">
        <option value="1">1M</option>
        <option value="3">3M</option>
        <option value="5">5M</option>
        <option value="15" selected>15M</option>
        <option value="30">30M</option>
        <option value="60">1H</option>
        <option value="240">4H</option>
        <option value="1440">1D</option>
      </select>

    </div>

  </div>
</header>

<main>

  <section class="chart-card">

    <div class="chart-header">

      <div>
        <span class="pair-name" id="pairDisplay">
          GBPUSD
        </span>

        <span class="tf-name" id="tfDisplay">
          15M
        </span>
      </div>

      <div class="mode">
        ● BACKTEST MODE
      </div>

    </div>

    <div id="chart"></div>

    <div class="toolbar">

      <button id="previous">
        ◀ Previous
      </button>

      <button id="next">
        Next Candle ▶
      </button>

      <button class="replay" id="reset">
        ↻ Reset Replay
      </button>

      <button id="fit">
        ⛶ Fit Chart
      </button>

      <div class="date-display" id="dateDisplay">
        Loading...
      </div>

    </div>

  </section>

  <section class="panel">

    <h2>Backtest Statistics</h2>

    <div class="stats">

      <div class="stat">
        <div class="label">Account Balance</div>
        <div class="value">$10,000</div>
      </div>

      <div class="stat">
        <div class="label">Risk Per Trade</div>
        <div class="value">1%</div>
      </div>

      <div class="stat">
        <div class="label">Trades</div>
        <div class="value" id="trades">0</div>
      </div>

      <div class="stat">
        <div class="label">Win Rate</div>
        <div class="value" id="winrate">0%</div>
      </div>

    </div>

  </section>

</main>

<script>

  const chartContainer = document.getElementById("chart");

  const chart = LightweightCharts.createChart(chartContainer, {
    layout: {
      background: {
        color: "#111820"
      },
      textColor: "#9aa6b2"
    },

    grid: {
      vertLines: {
        color: "#18212b"
      },
      horzLines: {
        color: "#18212b"
      }
    },

    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal
    },

    rightPriceScale: {
      borderColor: "#27303a"
    },

    timeScale: {
      borderColor: "#27303a",
      timeVisible: true,
      secondsVisible: false
    }
  });

  const candleSeries = chart.addCandlestickSeries({
    upColor: "#22c55e",
    downColor: "#ef4444",
    borderUpColor: "#22c55e",
    borderDownColor: "#ef4444",
    wickUpColor: "#22c55e",
    wickDownColor: "#ef4444"
  });


  let allCandles = [];
  let visibleCandles = [];
  let currentIndex = 0;


  /*
    Temporary test market data.

    This gives us real candlesticks and replay functionality
    while we build the real historical-data connection.
  */

  function createCandles(pair, timeframe) {

    const candles = [];

    let price = 1.2500;

    if (pair === "USDJPY") price = 150.000;
    if (pair === "GBPJPY") price = 190.000;
    if (pair === "EURJPY") price = 160.000;
    if (pair === "EURGBP") price = 0.8500;
    if (pair === "AUDUSD") price = 0.6500;
    if (pair === "NZDUSD") price = 0.5900;
    if (pair === "USDCAD") price = 1.3500;
    if (pair === "USDCHF") price = 0.8800;

    const start = new Date("2025-01-02T00:00:00Z");

    let intervalMinutes = Number(timeframe);

    for (let i = 0; i < 800; i++) {

      const time =
        Math.floor(start.getTime() / 1000) +
        i * intervalMinutes * 60;

      const movement =
        (Math.random() - 0.48) *
        (pair.includes("JPY") ? 0.20 : 0.0020);

      const open = price;

      const close = price + movement;

      const high =
        Math.max(open, close) +
        Math.abs(movement) * (0.5 + Math.random());

      const low =
        Math.min(open, close) -
        Math.abs(movement) * (0.5 + Math.random());

      candles.push({
        time: time,
        open: open,
        high: high,
        low: low,
        close: close
      });

      price = close;
    }

    return candles;
  }


  function loadChart() {

    const pair =
      document.getElementById("pair").value;

    const timeframe =
      document.getElementById("timeframe").value;

    allCandles =
      createCandles(pair, timeframe);

    currentIndex = 80;

    visibleCandles =
      allCandles.slice(0, currentIndex);

    candleSeries.setData(visibleCandles);

    chart.timeScale().fitContent();

    updateDate();

  }


  function updateDate() {

    if (!visibleCandles.length) return;

    const candle =
      visibleCandles[visibleCandles.length - 1];

    const date =
      new Date(candle.time * 1000);

    document.getElementById("dateDisplay").textContent =
      "Replay candle: " +
      date.toUTCString();

  }


  document.getElementById("next").onclick = function () {

    if (currentIndex >= allCandles.length) return;

    visibleCandles.push(
      allCandles[currentIndex]
    );

    currentIndex++;

    candleSeries.setData(visibleCandles);

    chart.timeScale().scrollToRealTime();

    updateDate();
  };


  document.getElementById("previous").onclick = function () {

    if (visibleCandles.length <= 1) return;

    visibleCandles.pop();

    currentIndex--;

    candleSeries.setData(visibleCandles);

    updateDate();
  };


  document.getElementById("reset").onclick = function () {

    currentIndex = 80;

    visibleCandles =
      allCandles.slice(0, currentIndex);

    candleSeries.setData(visibleCandles);

    chart.timeScale().fitContent();

    updateDate();
  };


  document.getElementById("fit").onclick = function () {

    chart.timeScale().fitContent();

  };


  document.getElementById("pair").onchange = function () {

    document.getElementById("pairDisplay").textContent =
      this.value;

    loadChart();

  };


  document.getElementById("timeframe").onchange = function () {

    const text =
      this.options[this.selectedIndex].text;

    document.getElementById("tfDisplay").textContent =
      text;

    loadChart();

  };


  window.addEventListener("resize", function () {

    chart.applyOptions({
      width: chartContainer.clientWidth,
      height: chartContainer.clientHeight
    });

  });


  loadChart();

</script>

</body>
  </html>
